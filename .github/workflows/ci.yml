name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    validate:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                node-version: 22
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Run tests
              run: npm test

            - name: Build application
              run: npm run build

            - name: Build Docker image
              if: github.event_name == 'pull_request'
              run: docker build -t portfolio-devops:${{ github.sha }} .

            - name: Scan Docker image
              if: github.event_name == 'pull_request'
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: 'portfolio-devops:${{ github.sha }}'
                format: table
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'HIGH,CRITICAL'
    
    publish:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: validate
        runs-on: ubuntu-24.04
        outputs:
          image_ref: ${{ steps.image.outputs.image_ref }}

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Build Docker image
              run: docker build -t portfolio-devops:${{ github.sha }} .

            - name: Scan Docker image
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: 'portfolio-devops:${{ github.sha }}'
                format: table
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'HIGH,CRITICAL'

            - name: Login to Azure with OIDC
              uses: azure/login@v3
              with:
                client-id: ${{ vars.AZURE_CLIENT_ID }}
                tenant-id: ${{ vars.AZURE_TENANT_ID }}
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Login to Azure Container Registry
              run: az acr login --name ${{ vars.ACR_NAME }}

            - name: Push Docker image
              env:
                REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
                IMAGE_NAME: portfolio-devops
                IMAGE_TAG: ${{ github.sha }}
              run: |
                docker tag "portfolio-devops:$IMAGE_TAG" "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
                docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

            - name: Resolve image digest
              id: image
              env:
                REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
                IMAGE_NAME: portfolio-devops
                IMAGE_TAG: ${{ github.sha }}
              run: |
                DIGEST=$(az acr repository show --name "${{ vars.ACR_NAME }}" --image "$IMAGE_NAME:$IMAGE_TAG" --query digest --output tsv)
                echo "image_ref=$REGISTRY/$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"

    deploy:
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      needs: publish
      runs-on: ubuntu-24.04

      permissions:
        contents: read
        id-token: write

      steps:
        - name: Login to Azure with OIDC
          uses: azure/login@v3
          with:
            client-id: ${{ vars.AZURE_CLIENT_ID }}
            tenant-id: ${{ vars.AZURE_TENANT_ID }}
            subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

        - name: Install Container Apps CLI extension
          run: az extension add --name containerapp --upgrade --allow-preview true

        - name: Deploy to Azure Container Apps
          env:
            IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
          run: |
            az containerapp update --name portfolio-devops --resource-group rg-portfolio-devops --image "$IMAGE_REF"

    terraform-validation:
      runs-on: ubuntu-24.04

      strategy:
        matrix:
          directory:
            - terraform
            - terraform/bootstrap

      defaults:
        run:
          working-directory: ${{ matrix.directory }}

      steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v4
          with:
            terraform_version: 1.16.3

        - name: Check Terraform formatting
          run: terraform fmt -check

        - name: Initialize Terraform
          run: terraform init -backend=false

        - name: Validate Terraform
          run: terraform validate

    terraform:
      name: terraform
      needs: terraform-validation
      if: always()
      runs-on: ubuntu-24.04

      steps:
        - name: Check Terraform validation result
          run: |
            if [ "${{ needs.terraform-validation.result }}" != "success" ]; then
              echo "Terraform validation failed."
              exit 1
            fi

            echo "All Terraform validation jobs passed."